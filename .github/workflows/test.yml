name: brew

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      # 2026.07.10.1; also taps this repository
      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
      - run: brew install hyunw3/tap/session-snap
      - run: brew test hyunw3/tap/session-snap
      - run: brew audit --strict hyunw3/tap/session-snap
      - run: session-snap --version
